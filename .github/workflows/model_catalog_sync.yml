name: 🤖 Weekly LLM Model Catalog D1 Sync

on:
  schedule:
    # 전체 동기화: 매주 월요일 한국시간 06:00 (UTC 일요일 21:00)
    #   모델 + 벤치마크 + 프로바이더 비교 + 변경 리포트 + 스냅샷
    - cron: '0 21 * * 0'
    # 모델 목록만: 화~일 한국시간 06:30 (UTC 월~토 21:30)
    #   주 1회로는 새 모델이 최대 7일 늦게 보였다(gemini-nano-banana-2.1 은 10/6 출시,
    #   다음 반영이 10/11). 모델 upsert 는 2분이면 끝나고 비용이 들지 않는다.
    - cron: '30 21 * * 1-6'
  workflow_dispatch:
    inputs:
      full:
        description: '전체 동기화 (벤치마크·프로바이더·리포트·스냅샷 포함)'
        required: false
        type: boolean
        default: false

jobs:
  model-d1-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 주간 스냅샷은 '지난주 대비 변경' 리포트의 기준이다. 매일 찍으면 리포트가 하루치만
      # 비교하게 되므로 무거운 단계는 주간 회차(또는 수동 full)에서만 돈다.
      FULL: ${{ github.event.schedule == '0 21 * * 0' || inputs.full == true }}

    steps:
      - name: 📦 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 2. Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🤖 3. OpenRouter API 수집 및 D1 SQL 생성
        run: |
          echo "📡 OpenRouter API에서 최신 LLM 모델 수집 시작..."
          python3 backend/scripts/model_d1_batch.py --dry-run
          echo "✅ SQL 파일 생성 완료"
          wc -l seed_models_batch.sql || true

      - name: ☁️ 4. Cloudflare D1에 모델 카탈로그 UPSERT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          echo "🚀 Cloudflare D1 models 테이블 갱신 중..."
          npx wrangler d1 execute llm-compass-db --remote --file=seed_models_batch.sql
          echo "✅ D1 모델 카탈로그 갱신 완료!"

      # 배치는 INSERT OR REPLACE 만 하고 DELETE 를 하지 않는다. 피드에서 사라진 모델이
      # 옛 가격 그대로 계속 노출되므로 지원 중단으로 표시한다. 삭제가 아니라 플래그라
      # 되돌릴 수 있고, 모델이 피드에 돌아오면 upsert 가 알아서 해제한다.
      - name: 🧹 4.5. 피드에서 사라진 모델 정리
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 안전장치: 이번 회차가 100건 미만이면 동기화가 제대로 끝나지 않은 것이므로
          # 건드리지 않는다. 없으면 일시적 피드 오류에 멀쩡한 모델이 대량 오탐된다.
          npx wrangler d1 execute llm-compass-db --remote --command "
            UPDATE models SET is_deprecated = 1
            WHERE source = 'feed'
              AND updated_at < datetime('now', '-1 hour')
              AND (SELECT COUNT(*) FROM models WHERE updated_at >= datetime('now','-1 hour')) > 100;
          "
          npx wrangler d1 execute llm-compass-db --remote --command "
            SELECT COUNT(*) AS deprecated FROM models WHERE is_deprecated = 1;
          "

      # 벤치마크는 피드가 주지 않는다. LMArena(Arena)·Epoch AI(GPQA) 공개 데이터셋에서 받는다.
      # 둘 다 CC-BY 4.0 — 화면에 출처를 표기해야 한다. 수집량이 하한에 못 미치면 스크립트가
      # 빈 SQL 을 남기고 끝나므로, 수집 실패가 멀쩡한 값을 null 로 덮지 않는다.
      - name: 📊 4.6. 벤치마크 동기화 (LMArena · Epoch AI)
        if: env.FULL == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q pyarrow
          if python3 backend/scripts/sync_benchmarks.py && [ -s seed_benchmarks.sql ]; then
            npx wrangler d1 execute llm-compass-db --remote --file=seed_benchmarks.sql
            echo "✅ 벤치마크 갱신 완료"
          else
            echo "⚠️ 벤치마크 갱신 건너뜀 (기존 값 유지)"
          fi

      # 같은 모델을 여러 곳이 서빙할 때의 단가·양자화·가동률. 예전 '추론 속도' 화면은
      # 손으로 적은 프로바이더 6줄을 41일째 "실시간"이라고 부르고 있었다.
      # 스크립트가 하한(모델 20개) 미달 시 빈 파일을 남기므로, 수집 실패가 표를 비우지 않는다.
      - name: ⚖️ 4.7. 프로바이더 엔드포인트 동기화 (OpenRouter)
        if: env.FULL == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if python3 backend/scripts/sync_provider_endpoints.py && [ -s provider_endpoints.sql ]; then
            npx wrangler d1 execute llm-compass-db --remote --file=provider_endpoints.sql
            npx wrangler d1 execute llm-compass-db --remote --command "
              SELECT COUNT(DISTINCT model_slug) AS models, COUNT(*) AS endpoints,
                     MAX(updated_at) AS updated FROM provider_endpoints;
            "
          else
            echo "⚠️ 프로바이더 엔드포인트 갱신 건너뜀 (기존 값 유지)"
          fi

      # 이전 회차의 스냅샷(= 그때의 갱신 후 상태)과 지금을 비교한다.
      # 스냅샷을 갱신 '전' 에 찍던 이전 방식은 이번 회차 변경분이 다음 회차에나
      # 담겨 리포트가 항상 한 주기 늦었다 (2026-09-06 실측: +18 이 어느 스냅샷에도
      # 없었다). 갱신 후에 찍으면 같은 회차 안에서 비교가 끝난다.
      - name: 📋 5. 카탈로그 변경 리포트
        if: env.FULL == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📋 직전 스냅샷과 비교..."
          npx wrangler d1 execute llm-compass-db --remote --command "
            WITH prev AS (
              SELECT * FROM model_snapshots
              WHERE captured_at = (SELECT MAX(captured_at) FROM model_snapshots)
            )
            SELECT '신규' AS kind, m.name, m.provider_name
              FROM models m LEFT JOIN prev p ON p.model_id = m.id
             WHERE p.model_id IS NULL AND m.is_deprecated = 0
            UNION ALL
            SELECT '폐기', p.name, p.provider_name
              FROM prev p JOIN models m ON m.id = p.model_id
             WHERE p.is_deprecated = 0 AND m.is_deprecated = 1
            UNION ALL
            SELECT '가격변경', m.name, m.provider_name
              FROM models m JOIN prev p ON p.model_id = m.id
             WHERE COALESCE(m.api_pricing,'') != COALESCE(p.api_pricing,'')
            LIMIT 100;
          "

      # 비교가 끝난 뒤에 찍어야 이번 회차 결과가 다음 회차의 기준이 된다.
      - name: 📸 6. 카탈로그 스냅샷 저장
        if: env.FULL == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute llm-compass-db --remote --command "
            DELETE FROM model_snapshots WHERE captured_at = date('now');
            INSERT INTO model_snapshots
              (captured_at, model_id, name, provider_name, api_pricing, context_window, benchmarks, is_deprecated)
            SELECT date('now'), id, name, provider_name, api_pricing, context_window, benchmarks, is_deprecated
            FROM models;
            DELETE FROM model_snapshots WHERE captured_at < date('now', '-180 days');
          "
          echo "✅ 스냅샷 완료"
          # 봇 방문 기록은 하루 약 2,000행씩 쌓인다(89% 가 MetaBot). 어드민은 최근 기간만
          # 보므로 90일 넘은 행은 지운다. 사람 방문(analytics_events)은 양이 적어 그대로 둔다.
          npx wrangler d1 execute llm-compass-db --remote --command "
            DELETE FROM crawler_hits WHERE created_at < datetime('now', '-90 days');
          "

      - name: 📊 7. 완료 확인
        run: |
          echo "📈 D1 최신 모델 수 확인..."
          curl -s "https://ai-model-agent.ai-azc2004.workers.dev/api/v1/models" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(f'✅ D1 모델 수: {len(d)}개')"
