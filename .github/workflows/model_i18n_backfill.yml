name: 🌐 Model Description i18n Backfill

# 카탈로그 동기화(model_catalog_sync)에서 분리했다.
#
# 동기화 본체는 몇 분이면 끝나지만 번역은 성격이 다르다. 모델당 6개 언어를
# 순차 호출해 2~4초가 걸리므로, 밀린 469개는 20~30분이 필요하다. 15분 타임아웃
# 안에서 매주 잘리며 재시도하는 구조로는 영원히 끝나지 않는다 — 실제로 180개에서
# 멈춰 있었다 (2026-09-06 실측: 정확히 15분에 cancelled).
#
# 여기서는 넉넉한 타임아웃으로 한 번에 완주시킨다. 밀린 분량이 소진된 뒤에는
# 주당 신규 20개 수준이라 몇 분이면 끝난다.

on:
  schedule:
    # 카탈로그 동기화(월 06:00 KST) 1시간 뒤 — 신규 모델이 들어온 다음에 돈다
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: '처리할 모델 수 (비우면 전부)'
        required: false
        type: string

jobs:
  i18n-backfill:
    runs-on: ubuntu-latest
    # 밀린 469개 × 2~4초 = 20~30분. 여유를 둔다.
    timeout-minutes: 50
    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 번역 스크립트는 내부에서 npx wrangler 로 D1 을 조회해 대상 모델을 고른다.
      # wrangler 와 CF 인증이 이 단계에도 있어야 한다.
      - name: 🌐 번역 생성
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 무료 엔진이 막히면 뉴스 배치와 같은 게이트웨이로 대체 번역한다.
          # 없으면 무료 엔진만 쓰고, 막힌 행은 다음 주에 재시도한다.
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          npm install -g wrangler
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ inputs.limit }}"
          fi
          echo "🌐 description_i18n 이 비어 있는 모델 번역 중... $LIMIT_ARG"
          python3 backend/scripts/translate_model_descriptions.py --missing-only $LIMIT_ARG

      - name: ☁️ D1 반영
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -s seed_model_i18n.sql ]; then
            npx wrangler d1 execute llm-compass-db --remote --file=seed_model_i18n.sql
            echo "✅ 다국어 설명 갱신 완료"
          else
            echo "ℹ️ 새로 번역할 모델 없음"
          fi

      - name: 📊 진행 상황
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute llm-compass-db --remote --command "
            SELECT COUNT(*) AS total,
                   SUM(CASE WHEN description_i18n IS NOT NULL AND description_i18n != ''
                            THEN 1 ELSE 0 END) AS translated
            FROM models;
          "
