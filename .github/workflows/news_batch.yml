name: 📰 Daily AI News D1 Batch Collector

on:
  schedule:
    # 매일 한국시간 오전 07:00 (UTC 22:00)에 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동 실행 가능

jobs:
  news-d1-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📦 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 2. Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📚 3. 의존성 설치
        run: pip install feedparser beautifulsoup4

      - name: 🧪 4. 뉴스 파이프라인 단위 테스트
        run: |
          python -m unittest \
            backend.tests.test_generate_trend_reports \
            backend.tests.test_trend_report_validation \
            -v

      - name: 🗞️ 5. 종합 트렌드 리포트 생성 및 D1 적재
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          npm install -g wrangler
          echo "📡 RSS 수집, 클러스터링, LLM 리포트 생성 및 D1 적재 시작..."
          python3 backend/scripts/generate_trend_reports.py
          echo "🎉 D1 종합 트렌드 리포트 배치 작업 완료!"

      - name: 📊 6. 완료 확인
        run: |
          echo "📈 D1 최신 기사 수 확인..."
          curl -s "https://ai-model-agent.ai-azc2004.workers.dev/api/v1/news/pulse" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(f'✅ D1 기사 수: {d[\"total_count\"]}개')"
